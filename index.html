<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EvilQuest — World Map</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }


body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0d0d0f;
  color: #d4c9a8;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}


/* ── Toolbar ── */
#toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  height: 46px;
  background: #161618;
  border-bottom: 1px solid #2a2820;
  flex-shrink: 0;
  z-index: 100;
  position: relative;
}


#toolbar h1 {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #c8a84b;
  white-space: nowrap;
  margin-right: 4px;
}


.sep {
  width: 1px;
  height: 20px;
  background: #2a2820;
  margin: 0 4px;
  flex-shrink: 0;
}


#toolbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
}


#toolbar-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 101;
}


.center-btn {
  height: 28px;
  padding: 0 12px;
  border-radius: 4px;
  border: 1px solid #2e2c26;
  background: #1e1c18;
  color: #c4b98a;
  font-size: 11px;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.center-btn:hover { background: #2a2826; }
.center-btn.reset-btn { border-color: #3a3060; color: #9a8abb; }
.center-btn.reset-btn:hover { background: rgba(100,80,180,0.15); }
.center-btn.off { opacity: 0.55; }


/* Search */
#search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}


#search-input {
  background: #1a1816;
  border: 1px solid #2a2820;
  border-radius: 4px;
  color: #c4b98a;
  font-size: 11px;
  padding: 4px 10px 4px 26px;
  width: 180px;
  height: 28px;
  font-family: inherit;
}
#search-input:focus { outline: none; border-color: #c8a84b; }
#search-input::placeholder { color: #3a3828; }


#search-icon {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  color: #4a4838;
  pointer-events: none;
}


#search-results {
  position: absolute;
  top: 34px;
  left: 0;
  width: 260px;
  background: #1a1814;
  border: 1px solid #2a2820;
  border-radius: 6px;
  z-index: 400;
  display: none;
  max-height: 220px;
  overflow-y: auto;
}


#search-results .sr-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 12px;
}
#search-results .sr-item:hover { background: #222018; }
#search-results .sr-type { font-size: 10px; color: #5a5848; }
#search-results .sr-empty { padding: 10px 12px; font-size: 12px; color: #4a4838; }


.zoom-btn {
  width: 26px;
  height: 26px;
  border-radius: 4px;
  border: 1px solid #2e2c26;
  background: #1e1c18;
  color: #c4b98a;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.zoom-btn:hover { background: #2a2826; }


/* ── Map ── */
#map-wrapper {
  flex: 1;
  overflow: hidden;
  position: relative;
  cursor: grab;
  background: #0a0a0c;
  background-image:
    radial-gradient(ellipse at 30% 40%, rgba(20,40,20,0.3) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 60%, rgba(15,25,40,0.3) 0%, transparent 60%);
}
#map-wrapper.dragging { cursor: grabbing; }


#map-canvas {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: 0 0;
}


#map-img {
  display: block;
  user-select: none;
  pointer-events: none;
  image-rendering: pixelated;
}


/* ── No data overlay ── */
#no-data {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: rgba(10,10,12,0.95);
  z-index: 50;
}
#no-data svg { opacity: 0.2; }
#no-data p {
  font-size: 13px;
  color: #5a5848;
  text-align: center;
  line-height: 1.6;
  max-width: 320px;
}


/* ── Category panel ── */
#layer-panel {
  position: absolute;
  top: 50%;
  right: 12px;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 120;
  pointer-events: auto;
}


.layer-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: 4px;
  border: 1px solid #2e2c26;
  background: #1e1c18;
  font-size: 11px;
  color: #c4b98a;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition: opacity 0.15s, background 0.15s;
  min-width: 120px;
  justify-content: flex-start;
}
.layer-btn:hover { background: #2a2826; }
.layer-btn.off { opacity: 0.35; }


.layer-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}


.layer-icon {
  font-size: 13px;
  line-height: 1;
}


/* ── Markers ── */
.marker {
  position: absolute;
  transform: translate(-50%, -100%);
  cursor: pointer;
  z-index: 10;
  transition: filter 0.1s;
}
.marker:hover { filter: brightness(1.4); z-index: 20; }
.marker.highlighted {
  filter: brightness(1.6) drop-shadow(0 0 6px rgba(200,168,75,0.9));
  z-index: 30;
  animation: pulse 1.2s ease-in-out 3;
}


@keyframes pulse {
  0%,100% { transform: translate(-50%,-100%) scale(1); }
  50% { transform: translate(-50%,-100%) scale(1.25); }
}


.marker-text.highlighted {
  animation: pulse-text 1.2s ease-in-out 3;
}
@keyframes pulse-text {
  0%,100% { transform: translate(-50%,-50%) scale(1); }
  50% { transform: translate(-50%,-50%) scale(1.2); }
}


.marker-pin {
  width: 26px;
  height: 26px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  border: 2px solid rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.6);
}
.marker-icon {
  transform: rotate(45deg);
  font-size: 12px;
  line-height: 1;
}
.marker-stem {
  width: 2px;
  height: 7px;
  background: rgba(0,0,0,0.4);
  margin-top: -1px;
}
.marker-png-img {
  width: 32px;
  height: 32px;
  object-fit: contain;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7));
  image-rendering: pixelated;
}
.marker-text-label {
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  text-shadow: 0 0 4px #000, 1px 1px 2px #000, -1px -1px 2px #000;
  letter-spacing: 0.04em;
  padding: 2px 0;
  cursor: pointer;
}
.marker-name-sub {
  font-size: 10px;
  color: #d4c9a8;
  text-shadow: 0 0 3px #000, 1px 1px 2px #000;
  white-space: nowrap;
  text-align: center;
  margin-top: 2px;
  pointer-events: none;
}


/* ── Tooltip ── */
#tooltip {
  position: absolute;
  background: #1a1814;
  border: 1px solid #3a3628;
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 12px;
  white-space: nowrap;
  pointer-events: none;
  z-index: 300;
  display: none;
}
#tooltip strong { display: block; font-size: 13px; font-weight: 600; color: #e0d4a8; margin-bottom: 2px; }
#tooltip .t-sub { font-size: 11px; color: #7a7060; display: block; }
#tooltip .t-link { font-size: 11px; color: #c8a84b; margin-top: 3px; display: block; }


/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2820; border-radius: 2px; }

<body>
<div id="toolbar">
  <h1>⚔ EvilQuest</h1>
  <div class="sep"></div>


  <div id="toolbar-center">
    <button class="center-btn" id="show-all">Show All</button>
    <button class="center-btn" id="hide-all">Hide All</button>
    <button class="center-btn" id="show-names">Show Names</button>
    <button class="center-btn reset-btn" id="btn-reset">⟳ Reset</button>
  </div>


  <div id="toolbar-right">
    <div id="search-wrap">
      <span id="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search map..." autocomplete="off" />
      <div id="search-results"></div>
    </div>
    <div class="sep"></div>
    <button class="zoom-btn" id="zin">+</button>
    <button class="zoom-btn" id="zout">−</button>
    <button class="zoom-btn" id="zreset" style="font-size:12px">⟳</button>
  </div>
</div>


<div id="map-wrapper">
  <div id="map-canvas">
    <img id="map-img" alt="EvilQuest world map" draggable="false" />
  </div>


  <div id="layer-panel"></div>


  <div id="no-data">
    <svg width="56" height="56" viewBox="0 0 64 64" fill="none">
      <rect x="4" y="4" width="56" height="56" rx="4" stroke="#c8a84b" stroke-width="2"/>
      <path d="M20 44 L20 20 L32 28 L44 16 L44 44 Z" stroke="#c8a84b" stroke-width="2" fill="none"/>
      <circle cx="22" cy="26" r="3" stroke="#c8a84b" stroke-width="2"/>
    </svg>
    <p>Map data not loaded.<br/>Place <code>mapdata.json</code> in the same folder as this file.</p>
  </div>


  <div id="tooltip"></div>
</div>


<script>
// ──────────────────────────────────────────
// State
// ──────────────────────────────────────────
let types = [];
let markers = [];
let layers = {};
let zoom = 1, panX = 0, panY = 0;
let isDragging = false, dsx, dsy, dpx, dpy;
let imgW = 800, imgH = 600;
let searchFilter = null;
let showNames = false;


const PNG_FOLDER = 'markericonpng/';


const wrapper  = document.getElementById('map-wrapper');
const canvas   = document.getElementById('map-canvas');
const mapImg   = document.getElementById('map-img');
const tooltip  = document.getElementById('tooltip');
const noData   = document.getElementById('no-data');
const layerDiv = document.getElementById('layer-panel');
const searchIn = document.getElementById('search-input');
const searchRes= document.getElementById('search-results');


// ──────────────────────────────────────────
// Show All / Hide All / Reset
// ──────────────────────────────────────────
document.getElementById('show-all').addEventListener('click', () => {
  types.forEach(t => { layers[t.id] = true; });
  document.querySelectorAll('.layer-btn').forEach(btn => btn.classList.remove('off'));
  renderMapMarkers();
});


document.getElementById('hide-all').addEventListener('click', () => {
  types.forEach(t => { layers[t.id] = false; });
  document.querySelectorAll('.layer-btn').forEach(btn => btn.classList.add('off'));
  renderMapMarkers();
});


document.getElementById('show-names').addEventListener('click', () => {
  showNames = !showNames;
  document.getElementById('show-names').classList.toggle('off', !showNames);
  renderMapMarkers();
});


document.getElementById('btn-reset').addEventListener('click', () => {
  // Show all categories
  types.forEach(t => { layers[t.id] = true; });
  document.querySelectorAll('.layer-btn').forEach(btn => btn.classList.remove('off'));
  // Clear search
  searchIn.value = '';
  searchFilter = null;
  searchRes.style.display = 'none';
  // Fit map to view
  fitMap();
  renderMapMarkers();
});


// ──────────────────────────────────────────
// Icon helpers
// ──────────────────────────────────────────
function iconSrc(iconVal) {
  if (!iconVal) return { type: 'emoji', value: '📍' };
  if (iconVal.startsWith('png:')) {
    const fname = iconVal.slice(4);
    const cached = tryGetPng(fname);
    return { type: 'png', value: cached || (PNG_FOLDER + fname), fname };
  }
  return { type: 'emoji', value: iconVal };
}


function tryGetPng(fname) {
  try { return sessionStorage.getItem('png_' + fname) || null; } catch(e) { return null; }
}


// ──────────────────────────────────────────
// Load mapdata.json
// ──────────────────────────────────────────


// Check for embedded data first (standalone mode)
if (window.__EMBEDDED_MAPDATA__) {
  init(window.__EMBEDDED_MAPDATA__);
} else {
  fetch('mapdata.json')
    .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(init)
    .catch(() => { noData.style.display = 'flex'; });
}


function init(data) {
  types   = (data.types   || []).map(t => ({ mode: 'pin', ...t }));
  markers = data.markers  || [];
  types.forEach(t => { layers[t.id] = true; });


  if (data.mapImage) {
    mapImg.src = data.mapImage;
    mapImg.onload = () => {
      imgW = mapImg.naturalWidth;
      imgH = mapImg.naturalHeight;
      mapImg.style.width  = imgW + 'px';
      mapImg.style.height = imgH + 'px';
      noData.style.display = 'none';
      fitMap();
      renderMapMarkers();
    };
  }


  buildLayerToggles();
}


// ──────────────────────────────────────────
// Layer toggles
// ──────────────────────────────────────────
function buildLayerToggles() {
  layerDiv.innerHTML = '';
  types.forEach(t => {
    const btn = document.createElement('div');
    btn.className = 'layer-btn';
    btn.dataset.id = t.id;


    let iconHtml = '';
    if (t.mode === 'text') {
      iconHtml = '<span class="layer-icon" style="font-size:10px;color:#8a8070;">Ⓣ</span>';
    } else if (t.icon && t.icon.startsWith('png:')) {
      const src = tryGetPng(t.icon.slice(4)) || (PNG_FOLDER + t.icon.slice(4));
      iconHtml = `<img src="${src}" style="width:14px;height:14px;object-fit:contain;image-rendering:pixelated;" />`;
    } else {
      iconHtml = `<span class="layer-icon">${t.icon || '📍'}</span>`;
    }


    btn.innerHTML = `<span class="layer-dot" style="background:${t.color}"></span>${iconHtml}${t.label}`;
    btn.addEventListener('click', () => {
      layers[t.id] = !layers[t.id];
      btn.classList.toggle('off', !layers[t.id]);
      renderMapMarkers();
    });
    layerDiv.appendChild(btn);
  });
}


// ──────────────────────────────────────────
// Transform
// ──────────────────────────────────────────
function applyTransform() {
  canvas.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
}


function fitMap() {
  const ww = wrapper.clientWidth, wh = wrapper.clientHeight;
  zoom = Math.min(ww / imgW, wh / imgH, 1);
  panX = (ww - imgW * zoom) / 2;
  panY = (wh - imgH * zoom) / 2;
  applyTransform();
}


function clampPan() {
  const ww = wrapper.clientWidth, wh = wrapper.clientHeight, m = 80;
  panX = Math.max(-(imgW * zoom - m), Math.min(ww - m, panX));
  panY = Math.max(-(imgH * zoom - m), Math.min(wh - m, panY));
}


wrapper.addEventListener('mousedown', e => {
  if (e.target.closest('.marker') || e.target.closest('#layer-panel')) return;
  isDragging = true;
  dsx = e.clientX; dsy = e.clientY;
  dpx = panX;      dpy = panY;
  wrapper.classList.add('dragging');
});


window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  panX = dpx + (e.clientX - dsx);
  panY = dpy + (e.clientY - dsy);
  clampPan(); applyTransform(); renderMapMarkers();
});


window.addEventListener('mouseup', () => {
  isDragging = false;
  wrapper.classList.remove('dragging');
});


wrapper.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = wrapper.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const f = e.deltaY < 0 ? 1.12 : 0.88;
  const nz = Math.max(0.1, Math.min(8, zoom * f));
  panX = mx - (mx - panX) * (nz / zoom);
  panY = my - (my - panY) * (nz / zoom);
  zoom = nz; clampPan(); applyTransform(); renderMapMarkers();
}, { passive: false });


document.getElementById('zin').addEventListener('click', () => {
  zoom = Math.min(8, zoom * 1.25); clampPan(); applyTransform(); renderMapMarkers();
});
document.getElementById('zout').addEventListener('click', () => {
  zoom = Math.max(0.1, zoom / 1.25); clampPan(); applyTransform(); renderMapMarkers();
});
document.getElementById('zreset').addEventListener('click', () => {
  fitMap(); renderMapMarkers();
});


// ──────────────────────────────────────────
// Render markers
// ──────────────────────────────────────────
function renderMapMarkers(highlightIdx = null) {
  document.querySelectorAll('.marker').forEach(m => m.remove());


  markers.forEach((m, idx) => {
    if (searchFilter !== null && !searchFilter.has(idx)) return;
    if (!layers[m.type]) return;


    const t = types.find(t => t.id === m.type);
    if (!t) return;


    const el = document.createElement('div');
    el.className = 'marker' + (idx === highlightIdx ? ' highlighted' : '');


    if (t.mode === 'text') {
      // Text label
      el.style.left = (panX + m.x * zoom) + 'px';
      el.style.top  = (panY + m.y * zoom) + 'px';
      el.style.transform = 'translate(-50%, -50%)';
      el.classList.add('marker-text');
      const label = document.createElement('div');
      label.className = 'marker-text-label';
      label.style.color = t.color || '#fff';
      label.textContent = m.name;
      el.appendChild(label);
    } else {
      el.style.left = (panX + m.x * zoom) + 'px';
      el.style.top  = (panY + m.y * zoom) + 'px';


      const iconVal = m.icon || t.icon;
      const { type: iconType, value: iconValue, fname } = iconSrc(iconVal);


      const wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;';


      if (iconType === 'png') {
        const img = document.createElement('img');
        img.className = 'marker-png-img';
        img.src = iconValue; img.alt = m.name; img.draggable = false;
        wrap.appendChild(img);
      } else {
        const pin = document.createElement('div');
        pin.className = 'marker-pin';
        pin.style.background = t.color;
        const icon = document.createElement('span');
        icon.className = 'marker-icon';
        icon.textContent = iconValue;
        pin.appendChild(icon);
        wrap.appendChild(pin);
        const stem = document.createElement('div');
        stem.className = 'marker-stem';
        wrap.appendChild(stem);
      }


      // Name label below
      if (showNames && m.name) {
        const nameLabel = document.createElement('div');
        nameLabel.className = 'marker-name-sub';
        nameLabel.textContent = m.name;
        wrap.appendChild(nameLabel);
      }


      el.appendChild(wrap);
    }


    el.addEventListener('mouseenter', ev => {
      const iconVal = m.icon || t.icon || '';
      const iconDisp = iconVal.startsWith('png:') ? '🖼' : iconVal;
      tooltip.innerHTML = `<strong>${m.name}</strong><span class="t-sub">${iconDisp} ${t.label}</span>${m.url ? '<span class="t-link">🔗 Click to open wiki</span>' : ''}`;
      tooltip.style.display = 'block';
      moveTooltip(ev);
    });
    el.addEventListener('mousemove', moveTooltip);
    el.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      if (m.url) window.open(m.url, '_blank');
    });


    wrapper.appendChild(el);
  });
}


function moveTooltip(ev) {
  const rect = wrapper.getBoundingClientRect();
  let x = ev.clientX - rect.left + 14;
  let y = ev.clientY - rect.top - 14;
  if (x + 190 > wrapper.clientWidth) x = ev.clientX - rect.left - 190;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}


// ──────────────────────────────────────────
// Search
// ──────────────────────────────────────────
searchIn.addEventListener('input', () => {
  const q = searchIn.value.trim().toLowerCase();


  if (!q) {
    searchFilter = null;
    searchRes.style.display = 'none';
    renderMapMarkers();
    return;
  }


  const hits = markers
    .map((m, i) => ({ m, i }))
    .filter(({ m }) => {
      const t = types.find(t => t.id === m.type);
      return m.name.toLowerCase().includes(q) || (t?.label || '').toLowerCase().includes(q);
    });


  searchFilter = new Set(hits.map(h => h.i));


  if (!hits.length) {
    searchRes.innerHTML = '<div class="sr-empty">No results</div>';
  } else {
    searchRes.innerHTML = hits.slice(0, 12).map(({ m, i }) => {
      const t = types.find(t => t.id === m.type);
      const iconDisp = (t?.icon && t.icon.startsWith('png:')) ? '🖼' : (t?.icon || '📍');
      return `<div class="sr-item" data-idx="${i}">
        <span style="font-size:16px">${iconDisp}</span>
        <div>
          <div>${m.name}</div>
          <div class="sr-type">${t?.label || m.type}</div>
        </div>
      </div>`;
    }).join('');


    searchRes.querySelectorAll('.sr-item').forEach(el => {
      el.addEventListener('click', () => {
        flyTo(parseInt(el.dataset.idx));
        searchRes.style.display = 'none';
        searchIn.value = '';
        searchFilter = null;
        renderMapMarkers();
      });
    });
  }


  searchRes.style.display = 'block';
  renderMapMarkers();
});


document.addEventListener('click', e => {
  if (!e.target.closest('#search-wrap')) searchRes.style.display = 'none';
});


searchIn.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    searchRes.style.display = 'none';
    searchIn.value = '';
    searchFilter = null;
    renderMapMarkers();
  }
  if (e.key === 'Enter') {
    const first = searchRes.querySelector('.sr-item');
    if (first) {
      flyTo(parseInt(first.dataset.idx));
      searchRes.style.display = 'none';
      searchIn.value = '';
      searchFilter = null;
      renderMapMarkers();
    }
  }
});


// ──────────────────────────────────────────
// Fly to marker
// ──────────────────────────────────────────
function flyTo(idx) {
  const m = markers[idx];
  if (!m) return;


  if (!layers[m.type]) {
    layers[m.type] = true;
    const btn = layerDiv.querySelector(`[data-id="${m.type}"]`);
    if (btn) btn.classList.remove('off');
  }


  const ww = wrapper.clientWidth, wh = wrapper.clientHeight;
  const targetZoom = Math.max(zoom, 1.5);
  panX = ww / 2 - m.x * targetZoom;
  panY = wh / 2 - m.y * targetZoom;
  zoom = targetZoom;
  clampPan(); applyTransform();
  renderMapMarkers(idx);


  setTimeout(() => renderMapMarkers(), 4000);
}
</script>
